<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 724" width="1200" height="724" role="img" aria-label="Makor extraction pipeline and the settings that shape each stage">
<style>
  .t{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#1f2328} .m{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#59636e}
  .h{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:600;fill:#1f2328} .n{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;fill:#0f7a96;font-weight:600}
  .c{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;font-size:11px;fill:#0f7a96} .cu{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;font-size:11px;fill:#1f2328}
  .lane{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;font-size:11px;letter-spacing:.12em;fill:#59636e;font-weight:600}
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<rect width="1200" height="724" rx="16" fill="#f6f8fa"/>
<rect x="20" y="20" width="262" height="644" rx="12" fill="#eef1f4"/>
<rect x="298" y="20" width="882" height="644" rx="12" fill="#eef1f4"/>
<text x="36" y="44" class="lane">WEB APP · NEXT.JS</text>
<text x="314" y="44" class="lane">ENGINE · FASTAPI · STATELESS</text>
<rect x="560.0" y="31" width="139.3" height="18" rx="4" fill="#e3f3f7" stroke="#0f7a96" stroke-width="1"/>
<text x="566.0" y="44" class="c">MAKOR_ENGINE_SECRET</text>
<rect x="705.3" y="31" width="152.7" height="18" rx="4" fill="#e3f3f7" stroke="#0f7a96" stroke-width="1"/>
<text x="711.3" y="44" class="c">MAKOR_MAX_CONCURRENCY</text>
<rect x="864.0" y="31" width="112.5" height="18" rx="4" fill="#e3f3f7" stroke="#0f7a96" stroke-width="1"/>
<text x="870.0" y="44" class="c">MAKOR_MAX_QUEUE</text>
<rect x="34" y="62" width="234" height="176" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="48" y="88" class="h" font-size="15">Accept</text>
<text x="48" y="110" class="m" font-size="12.5" xml:space="preserve">photo, scan or PDF · ≤ 30 MB</text>
<text x="48" y="128" class="m" font-size="12.5" xml:space="preserve">key or session → mode:</text>
<text x="48" y="146" class="m" font-size="12.5" xml:space="preserve">local · trial · own Anthropic key</text>
<rect x="48.0" y="168" width="72.3" height="18" rx="4" fill="#e3f3f7" stroke="#0f7a96" stroke-width="1"/>
<text x="54.0" y="181" class="c">AUTH_MODE</text>
<rect x="126.3" y="168" width="79.0" height="18" rx="4" fill="#e3f3f7" stroke="#0f7a96" stroke-width="1"/>
<text x="132.3" y="181" class="c">TRIAL_DOCS</text>
<rect x="48.0" y="192" width="159.4" height="18" rx="4" fill="#e3f3f7" stroke="#0f7a96" stroke-width="1"/>
<text x="54.0" y="205" class="c">API_RATE_LIMIT_PER_MIN</text>
<rect x="34" y="330" width="234" height="140" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="48" y="356" class="h" font-size="15">Check registries</text>
<text x="48" y="378" class="m" font-size="12.5" xml:space="preserve">IDs, accounts, full names</text>
<text x="48" y="396" class="m" font-size="12.5" xml:space="preserve">against local public lists</text>
<rect x="48.0" y="418" width="119.2" height="18" rx="4" fill="#ffffff" stroke="#59636e" stroke-width="1" stroke-dasharray="3 2"/>
<text x="54.0" y="431" class="cu">check_registries</text>
<rect x="34" y="488" width="234" height="140" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="48" y="514" class="h" font-size="15">Record · respond</text>
<text x="48" y="536" class="m" font-size="12.5" xml:space="preserve">metadata row; the result only</text>
<text x="48" y="554" class="m" font-size="12.5" xml:space="preserve">when stored, encrypted → JSON</text>
<rect x="48.0" y="576" width="99.1" height="18" rx="4" fill="#ffffff" stroke="#59636e" stroke-width="1" stroke-dasharray="3 2"/>
<text x="54.0" y="589" class="cu">store_results</text>
<rect x="48.0" y="600" width="119.2" height="18" rx="4" fill="#e3f3f7" stroke="#0f7a96" stroke-width="1"/>
<text x="54.0" y="613" class="c">MAKOR_MASTER_KEY</text>
<rect x="312" y="62" width="200" height="176" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="326" y="88" class="n" font-size="12">01</text>
<text x="350" y="88" class="h" font-size="15">Prepare page</text>
<text x="326" y="110" class="m" font-size="12.5" xml:space="preserve">PDF page 1 at 200 dpi</text>
<text x="326" y="128" class="m" font-size="12.5" xml:space="preserve">long edge ≤ 3508 px</text>
<rect x="530" y="62" width="200" height="176" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="544" y="88" class="n" font-size="12">02</text>
<text x="568" y="88" class="h" font-size="15">Detect</text>
<text x="544" y="110" class="m" font-size="12.5" xml:space="preserve">OpenCV finds documents;</text>
<text x="544" y="128" class="m" font-size="12.5" xml:space="preserve">a model only as fallback</text>
<path d="M514,150.0 L527,150.0" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="748" y="62" width="200" height="176" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="762" y="88" class="n" font-size="12">03</text>
<text x="786" y="88" class="h" font-size="15">Cut</text>
<text x="762" y="110" class="m" font-size="12.5" xml:space="preserve">crop from the original,</text>
<text x="762" y="128" class="m" font-size="12.5" xml:space="preserve">deskew ≥ 12°, orient</text>
<path d="M732,150.0 L745,150.0" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="966" y="62" width="200" height="176" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="980" y="88" class="n" font-size="12">04</text>
<text x="1004" y="88" class="h" font-size="15">Classify · triage</text>
<text x="980" y="110" class="m" font-size="12.5" xml:space="preserve">one thumbnail call a frame</text>
<text x="980" y="128" class="m" font-size="12.5" xml:space="preserve">picks what is read, and how</text>
<rect x="980.0" y="150" width="105.8" height="18" rx="4" fill="#e3f3f7" stroke="#0f7a96" stroke-width="1"/>
<text x="986.0" y="163" class="c">MAKOR_CLASSIFY</text>
<rect x="980.0" y="174" width="159.4" height="18" rx="4" fill="#e3f3f7" stroke="#0f7a96" stroke-width="1"/>
<text x="986.0" y="187" class="c">MAKOR_CLASSIFIER_MODEL</text>
<rect x="980.0" y="198" width="152.7" height="18" rx="4" fill="#e3f3f7" stroke="#0f7a96" stroke-width="1"/>
<text x="986.0" y="211" class="c">MAKOR_CLASSIFY_EFFORT</text>
<path d="M950,150.0 L963,150.0" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/>
<path d="M268,150 L309,150" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="1016" y="330" width="150" height="298" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="1030" y="356" class="n" font-size="12">05</text>
<text x="1054" y="356" class="h" font-size="15">Resolution</text>
<text x="1030" y="378" class="m" font-size="12.5" xml:space="preserve">dpi estimated from</text>
<text x="1030" y="396" class="m" font-size="12.5" xml:space="preserve">a known physical</text>
<text x="1030" y="414" class="m" font-size="12.5" xml:space="preserve">width, resampled;</text>
<text x="1030" y="432" class="m" font-size="12.5" xml:space="preserve">warns below 150 dpi</text>
<rect x="1030.0" y="454" width="119.2" height="18" rx="4" fill="#e3f3f7" stroke="#0f7a96" stroke-width="1"/>
<text x="1036.0" y="467" class="c">MAKOR_TARGET_DPI</text>
<rect x="662" y="330" width="336" height="298" rx="10" fill="#ffffff" stroke="#0f7a96" stroke-width="1.5"/>
<text x="676" y="356" class="n" font-size="12">06</text><text x="700" y="356" class="h" font-size="15">Read</text>
<rect x="676.0" y="368" width="99.1" height="18" rx="4" fill="#e3f3f7" stroke="#0f7a96" stroke-width="1"/>
<text x="682.0" y="381" class="c">MAKOR_BACKEND</text>
<rect x="781.1" y="368" width="85.7" height="18" rx="4" fill="#e3f3f7" stroke="#0f7a96" stroke-width="1"/>
<text x="787.1" y="381" class="c">MAKOR_MODEL</text>
<rect x="872.8" y="368" width="58.9" height="18" rx="4" fill="#ffffff" stroke="#59636e" stroke-width="1" stroke-dasharray="3 2"/>
<text x="878.8" y="381" class="cu">backend</text>
<rect x="937.7" y="368" width="45.5" height="18" rx="4" fill="#ffffff" stroke="#59636e" stroke-width="1" stroke-dasharray="3 2"/>
<text x="943.7" y="381" class="cu">model</text>
<rect x="676" y="398" width="308" height="104" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="676" y="398" width="4" height="104" rx="2" fill="#6f42c1"/>
<text x="690" y="418" font-size="13" font-weight="600" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#6f42c1">ollama · Qwen3-VL, local</text>
<text x="690" y="438" class="m" font-size="12">transcribe lines → fields on a flat schema</text>
<text x="690" y="455" class="m" font-size="12">→ anchors and label gate over the transcript</text>
<rect x="690.0" y="471" width="119.2" height="18" rx="4" fill="#e3f3f7" stroke="#0f7a96" stroke-width="1"/>
<text x="696.0" y="484" class="c">MAKOR_OLLAMA_URL</text>
<rect x="815.2" y="471" width="85.7" height="18" rx="4" fill="#ffffff" stroke="#59636e" stroke-width="1" stroke-dasharray="3 2"/>
<text x="821.2" y="484" class="cu">local_model</text>
<rect x="676" y="512" width="308" height="104" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="676" y="512" width="4" height="104" rx="2" fill="#bc4c00"/>
<text x="690" y="532" font-size="13" font-weight="600" style="font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#bc4c00">anthropic · Claude</text>
<text x="690" y="552" class="m" font-size="12">one structured read per frame, published as read</text>
<rect x="690.0" y="568" width="125.9" height="18" rx="4" fill="#e3f3f7" stroke="#0f7a96" stroke-width="1"/>
<text x="696.0" y="581" class="c">ANTHROPIC_API_KEY</text>
<rect x="690.0" y="592" width="159.4" height="18" rx="4" fill="#e3f3f7" stroke="#0f7a96" stroke-width="1"/>
<text x="696.0" y="605" class="c">MAKOR_ANTHROPIC_EFFORT</text>
<rect x="474" y="330" width="170" height="298" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="488" y="356" class="n" font-size="12">07</text>
<text x="512" y="356" class="h" font-size="15">Validate</text>
<text x="488" y="378" class="m" font-size="12.5" xml:space="preserve">no model in the loop:</text>
<text x="488" y="396" class="m" font-size="12.5" xml:space="preserve">MRZ (ICAO 9303) and</text>
<text x="488" y="414" class="m" font-size="12.5" xml:space="preserve">MICR check digits,</text>
<text x="488" y="432" class="m" font-size="12.5" xml:space="preserve">the Israeli ID digit,</text>
<text x="488" y="450" class="m" font-size="12.5" xml:space="preserve">printed vs MRZ / MICR</text>
<text x="488" y="468" class="m" font-size="12.5" xml:space="preserve">→ verified · partial ·</text>
<text x="488" y="486" class="m" font-size="12.5" xml:space="preserve">unverified · mismatch</text>
<rect x="312" y="330" width="144" height="298" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="326" y="356" class="n" font-size="12">08</text>
<text x="350" y="356" class="h" font-size="15">Merge</text>
<text x="326" y="378" class="m" font-size="12.5" xml:space="preserve">one document +</text>
<text x="326" y="396" class="m" font-size="12.5" xml:space="preserve">its companions</text>
<text x="326" y="414" class="m" font-size="12.5" xml:space="preserve">(card + sefach,</text>
<text x="326" y="432" class="m" font-size="12.5" xml:space="preserve">cheque + back);</text>
<text x="326" y="450" class="m" font-size="12.5" xml:space="preserve">rest is skipped</text>
<path d="M1066.0,240 L1066.0,284 L1091.0,284 L1091.0,327" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/>
<path d="M1014,479.0 L1001,479.0" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/>
<path d="M660,479.0 L647,479.0" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/>
<path d="M472,479.0 L459,479.0" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/>
<path d="M310,390 L271,390" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/>
<path d="M151,470 L151,485" fill="none" stroke="#8c959f" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="34.0" y="684" width="58.9" height="18" rx="4" fill="#e3f3f7" stroke="#0f7a96" stroke-width="1"/>
<text x="40.0" y="697" class="c">ENV_VAR</text>
<text x="112" y="697" class="m" font-size="12">set in .env for the whole instance</text>
<rect x="350.0" y="684" width="58.9" height="18" rx="4" fill="#ffffff" stroke="#59636e" stroke-width="1" stroke-dasharray="3 2"/>
<text x="356.0" y="697" class="cu">setting</text>
<text x="428" y="697" class="m" font-size="12">per user, on the Settings page or PATCH /api/v1/settings</text>
<text x="1166" y="697" class="m" font-size="12" text-anchor="end">docs/engine-pipeline.md has every stage</text>
</svg>